plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.lkj.steak'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lkj.steak'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
    }

    // 매번 같은 서명으로 만들어야 새 버전을 덮어 설치할 수 있어요
    signingConfigs {
        debug {
            storeFile file('steak.keystore')
            storePassword 'steak1234'
            keyAlias 'steak'
            keyPassword 'steak1234'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
